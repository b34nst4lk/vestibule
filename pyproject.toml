[project]
name = "portcullis"
version = "0.1.0"
description = "A plugin-based MCP server using pluggy for extensibility"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.28.1",
    "pluggy>=1.6.0",
    "pydantic>=2.0",
    "typer>=0.27.0",
    "starlette>=0.30",
    "uvicorn>=0.25",
    "httpx>=0.25",
]

[project.scripts]
portcullis = "portcullis.cli:main"

[project.entry-points."portcullis.plugins"]
# Plugins register here, e.g.:
# email = "portcullis_email"

[tool.uv.workspace]
members = ["packages/portcullis_email"]

[tool.uv.sources]
portcullis = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/portcullis_email/tests"]
markers = [
    "integration: Integration tests (stdio/HTTP)",
    "http: HTTP/SSE transport tests (requires running server)",
    "slow: Slow running tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
