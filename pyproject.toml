[project]
name = "vestibule"
version = "0.1.0"
description = "A plugin-based MCP server using pluggy for extensibility"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.28.1",
    "pluggy>=1.6.0",
    "pydantic>=2.0",
    "typer>=0.27.0",
    "starlette>=0.30",
    "uvicorn>=0.25",
    "httpx>=0.25",
]

[project.scripts]
vestibule = "vestibule.cli:main"

[project.entry-points."vestibule.plugins"]
# Plugins register here, e.g.:
# email = "vestibule_email"

[tool.uv.workspace]
members = ["packages/vestibule_email", "packages/vestibule_example"]

[tool.uv.sources]
vestibule = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=4.6.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff-format)
]

[tool.ruff.lint.isort]
known-first-party = ["vestibule"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/vestibule_email/tests", "packages/vestibule_example/tests"]
markers = [
    "integration: Integration tests (stdio/HTTP)",
    "http: HTTP/SSE transport tests (requires running server)",
    "slow: Slow running tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
