name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Space-separated uv package names to build and publish.
          Leave default to publish all published packages.
        required: false
        default: 'vestibule vestibule_whitelisted_email'
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Build selected packages
        run: |
          PACKAGES="${{ inputs.packages || 'vestibule vestibule_whitelisted_email' }}"
          for pkg in $PACKAGES; do
            uv build --package "$pkg"
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
