[project]
name = "vestibule-example"
version = "0.1.0"
description = "Example plugin demonstrating the Vestibule plugin API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "vestibule",
    "mcp[cli]>=1.27,<2",
    "pydantic>=2.0",
]

[project.entry-points."vestibule.plugins"]
example = "vestibule_example"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
