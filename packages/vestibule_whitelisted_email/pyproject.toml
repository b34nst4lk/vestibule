[project]
name = "vestibule-whitelisted-email"
version = "0.1.0"
description = "Whitelisted email plugin for Vestibule MCP server"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "vestibule>=0.1.0",
    "mcp[cli]>=1.28.1,<2",
    "pydantic>=2.0",
]

[project.entry-points."vestibule.plugins"]
whitelisted_email = "vestibule_whitelisted_email"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
