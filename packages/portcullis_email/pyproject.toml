[project]
name = "portcullis-email"
version = "0.1.0"
description = "Email whitelisting plugin for Portcullis MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "portcullis",
    "mcp[cli]>=1.27,<2",
    "pydantic>=2.0",
]

[project.entry-points."portcullis.plugins"]
email = "portcullis_email"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
