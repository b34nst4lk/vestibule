[project]
name = "vestibule-email"
version = "0.1.0"
description = "Email whitelisting plugin for Vestibule MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "vestibule",
    "mcp[cli]>=1.27,<2",
    "pydantic>=2.0",
]

[project.entry-points."vestibule.plugins"]
email = "vestibule_email"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
